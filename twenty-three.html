<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button Demo</title>

    <!-- 引入 Roboto 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            padding: 50px;
        }

        /* 按鈕樣式 */
        .custom-btn {
            height: 22px;
            line-height: 22px; /* 讓文字垂直置中 */
            padding: 0 10px;

            font-size: 13px;
            color: #2f2f2f;

            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            border-radius: 8px;

            cursor: pointer;
        }

        /* hover 效果（工程師通常會加） */
        .custom-btn:hover {
            background-color: #f5f5f5;
        }

        /* 點擊效果 */
        .custom-btn:active {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <button class="custom-btn">查看資訊</button>

</body>
</html>
