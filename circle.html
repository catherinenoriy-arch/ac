<!DOCTYPE html>
<html>
<head>
<style>
.container{
    position: relative;
    width: 400px;
    height: 250px;
}

.rectangle{
    width: 200px;
    height: 200px;
    background-color: red;
    border: 5px solid yellow;
    position: absolute;
    left: 50px;
    top: 30px;
}

.circle{
    width: 180px;
    height: 180px;
    background-color: green;
    border: 8px solid blue;
    border-radius: 50%;
    position: absolute;
    left: 150px;
    top: 50px;
}
</style>
</head>

<body>

<div class="container">
    <div class="rectangle"></div>
    <div class="circle"></div>
</div>

</body>
</html>
