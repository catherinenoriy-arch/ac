<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Interaction</title>
    <style>
        body {
            font-family: Arial;
        }
        .box {
            width: 200px;
            height: 150px;
            border: 1px solid #ccc;
            display: inline-block;
            margin: 10px;
            padding: 10px;
            text-align: center;
        }
        .text {
            font-size: 24px;
            margin-bottom: 20px;
            color: black;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <div id="text" class="text">Hello</div>
    <button 
        onmouseover="mouseOver()" 
        onclick="mouseClick()">
        Button
    </button>
</div>

<script>
    function mouseOver() {
        let t = document.getElementById("text");
        t.style.color = "hotpink";
    }

    function mouseClick() {
        let t = document.getElementById("text");
        t.innerText = "Mouse Click";
        t.style.color = "hotpink";
    }
</script>

</body>
</html>
