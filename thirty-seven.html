<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓形屬性計算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        input, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>圓形計算器</h2>
    <label for="radiusInput">請輸入圓的半徑：</label>
    <input type="number" id="radiusInput" placeholder="例如: 5" value="5">
    
    <button onclick="handleCalculation()">開始計算</button>

    <div class="result">
        <p id="circumferenceResult">圓周長將顯示於此</p>
        <p id="areaResult">圓面積將顯示於此</p>
    </div>
</div>

<script>
    // 1. 建立計算圓周長的函式
    function calcCircumference(radius) {
        // 圓周長公式：2 * π * r
        var circumference = 2 * Math.PI * radius;
        // 將結果四捨五入到小數點後兩位，並回傳格式化字串
        return "The circumference is " + circumference.toFixed(2);
    }

    // 2. 建立計算圓面積的函式
    function calcArea(radius) {
        // 圓面積公式：π * r^2
        var area = Math.PI * Math.pow(radius, 2);
        // 將結果四捨五入到小數點後兩位，並回傳格式化字串
        return "The area is " + area.toFixed(2);
    }

    // 點擊按鈕時觸發的邏輯
    function handleCalculation() {
        // 取得使用者輸入的半徑值
        var radius = parseFloat(document.getElementById("radiusInput").value);

        if (isNaN(radius) || radius <= 0) {
            alert("請輸入有效的正數字半徑！");
            return;
        }

        // 呼叫函式並更新網頁內容
        document.getElementById("circumferenceResult").innerText = calcCircumference(radius);
        document.getElementById("areaResult").innerText = calcArea(radius);
    }

    // 網頁載入時先自動執行一次預設值 (半徑 5)
    handleCalculation();
</script>

</body>
</html>
