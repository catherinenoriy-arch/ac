<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello World Design</title>
<style>
  body {
    background-color: #eee;
    font-family: "Times New Roman", serif;
  }

  .container {
    width: 600px;
    margin: 50px auto;
    padding: 20px;
    background: #f5f5f5;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  /* Top box */
  .box1 {
    background-color: #9bbbc7;
    border: 5px solid red;
    outline: 5px solid orange;
    padding: 10px;
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 20px;
  }

  /* Middle box */
  .box2 {
    background-color: yellow;
    border: 3px solid #007bff;
    border-radius: 10px;
    padding: 10px;
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 20px;
  }

  /* Bottom box */
  .box3 {
    background-color: #49a86e;
    border: 6px dotted gray;
    padding: 10px;
    font-size: 36px;
    font-weight: bold;
  }

</style>
</head>
<body>

<div class="container">
  <div class="box1">Hello World</div>
  <div class="box2">Hello World</div>
  <div class="box3">Hello World</div>
</div>

</body>
</html>
